<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Food Man OS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme_new.css') }}">
</head>
<body class="auth-body">

  <div class="auth-card">
    
    <!-- Logo & Brand -->
    <div class="auth-header">
      <div class="auth-logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
      </div>
      <h1 class="auth-title">FOOD MAN OS</h1>
      <p class="auth-subtitle">Smart Food Manufacturing & Cold-Chain Supply Network</p>
    </div>

    <!-- Error Alert -->
    {% if error %}
    <div class="auth-error-alert">
      {{ error }}
    </div>
    {% endif %}

    <!-- Standard Login Form -->
    <form class="auth-form" method="POST" action="{{ url_for('auth.login') }}">
      <div class="auth-input-group">
        <label class="auth-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="auth-input" placeholder="admin@foodman.vn" required>
      </div>

      <div class="auth-input-group">
        <label class="auth-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="auth-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-auth-submit">Sign In</button>
    </form>

    <!-- Quick Role-Switch Demo for Reviewers & Whole Team -->
    <div class="demo-roles-container">
      <div class="demo-roles-label">⚡ ONE-CLICK ROLE DEMO LOGIN (DEPARTMENT WORKSPACES)</div>
      <div class="demo-roles-chips">
        <a href="{{ url_for('auth.demo_login', role='Admin') }}" class="demo-role-btn" title="Admin/Manager → lands on Executive Dashboard (Full Access)">
          <span class="role-icon-dot" style="background-color:#1E3A8A;"></span>
          Admin / Manager
        </a>
        <a href="{{ url_for('auth.demo_login', role='Procurement') }}" class="demo-role-btn" title="Procurement Staff → lands on Suppliers & Raw Materials / Purchase Management">
          <span class="role-icon-dot" style="background-color:#0284C7;"></span>
          Procurement Staff
        </a>
        <a href="{{ url_for('auth.demo_login', role='QC') }}" class="demo-role-btn" title="QC Executive → lands on QC & AI Inspection Queue">
          <span class="role-icon-dot" style="background-color:#059669;"></span>
          QC Executive
        </a>
        <a href="{{ url_for('auth.demo_login', role='Production') }}" class="demo-role-btn" title="Production Staff → lands on Batch & Production">
          <span class="role-icon-dot" style="background-color:#D97706;"></span>
          Production Staff
        </a>
        <a href="{{ url_for('auth.demo_login', role='Warehouse') }}" class="demo-role-btn" title="Warehouse/Dispatch Staff → lands on Warehouse Management & Dispatch">
          <span class="role-icon-dot" style="background-color:#7C3AED;"></span>
          Warehouse / Dispatch
        </a>
        <a href="{{ url_for('auth.demo_login', role='Food Technologist') }}" class="demo-role-btn" title="Food Technologist → lands on Full Lifecycle Quality Dashboard (Read-Only)">
          <span class="role-icon-dot" style="background-color:#0D9488;"></span>
          Food Technologist
        </a>
      </div>
    </div>

  </div>

</body>
</html>
